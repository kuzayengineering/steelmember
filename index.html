<style>
:root{
  --paper:#F2F0EA;
  --paper-2:#EAE7DD;
  --ink:#20242A;
  --ink-soft:#4A4F56;
  --steel:#3D5266;
  --steel-dark:#2A3746;
  --mill:#6C7680;
  --line:#CFC9BC;
  --rivet:#C4501C;
  --rivet-soft:#EDD9CC;
  --white:#FCFBF8;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;}
.app{max-width:1100px;margin:0 auto;padding:0 20px 60px;}
button,.pill,.cat-tile,tbody tr,.suggest-item,.backlink{touch-action:manipulation;}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Space Grotesk',sans-serif;}

header.top{position:sticky;top:0;background:var(--paper);z-index:10;border-bottom:1px solid var(--line);padding:16px 0;}
.top-row{display:flex;align-items:center;gap:20px;max-width:1100px;margin:0 auto;padding:0 20px;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;}
.brand-icon-img{width:40px;height:40px;flex-shrink:0;display:block;border-radius:9px;box-shadow:0 0 0 1px var(--line);}
.brand-title-img{height:34px;width:auto;display:block;}
.search-wrap{flex:1;position:relative;}
.search-input{width:100%;height:40px;border:1.5px solid var(--line);background:var(--white);border-radius:2px;padding:0 14px;font-size:14px;font-family:'IBM Plex Sans';color:var(--ink);outline:none;}
.search-input:focus{border-color:var(--steel);}
.suggest{position:absolute;top:44px;left:0;right:0;background:var(--white);border:1.5px solid var(--steel);border-top:none;max-height:280px;overflow-y:auto;z-index:20;display:none;}
.suggest.open{display:block;}
.suggest-item{padding:9px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:hover{background:var(--paper-2);}
.suggest-item .nm{font-family:'IBM Plex Mono';font-weight:500;}
.suggest-item .ct{color:var(--mill);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}

.tick{position:relative;}
.tick::before,.tick::after{content:'';position:absolute;width:9px;height:9px;border-color:var(--steel);}
.tick::before{top:-1px;left:-1px;border-top:2px solid var(--steel);border-left:2px solid var(--steel);}
.tick::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--steel);border-right:2px solid var(--steel);}

.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mill);margin:32px 0 6px;}
.page-title{font-family:'Space Grotesk';font-weight:600;font-size:26px;margin:0 0 24px;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.cat-tile{background:var(--white);border:1.5px solid var(--line);padding:22px 12px 16px;text-align:center;cursor:pointer;transition:border-color .15s;position:relative;}
.cat-tile:hover{border-color:var(--steel);}
.cat-tile svg{width:56px;height:56px;stroke:var(--steel);}
.cat-tile .nm{display:block;margin-top:10px;font-family:'Space Grotesk';font-weight:600;font-size:13px;}
.cat-tile .sub{display:block;font-size:11px;color:var(--mill);margin-top:2px;}
.soon-badge{position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:.04em;text-transform:uppercase;background:var(--rivet-soft);color:#7A3210;padding:2px 6px;}

.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;}
.pill{border:1.5px solid var(--line);background:var(--white);padding:8px 16px;font-size:13px;font-family:'IBM Plex Mono';cursor:pointer;color:var(--ink-soft);}
.pill.active{border-color:var(--steel);background:var(--steel);color:var(--white);}
.pill:hover:not(.active):not(.pill-soon){border-color:var(--steel);}
.pill-soon{opacity:.5;cursor:default;}

.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--steel);font-size:13px;cursor:pointer;margin-top:20px;border:none;background:none;padding:0;font-family:'IBM Plex Sans';}
.backlink:hover{text-decoration:underline;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;flex-wrap:wrap;gap:10px;}
.count{font-size:12px;color:var(--mill);text-transform:uppercase;letter-spacing:.05em;}
.btnrow{display:flex;gap:8px;}
.btn{border:1.5px solid var(--steel);background:var(--white);color:var(--steel);padding:8px 14px;font-size:12px;font-family:'IBM Plex Sans';font-weight:500;cursor:pointer;letter-spacing:.02em;}
.btn:hover{background:var(--steel);color:var(--white);}
.btn.ghost{border-color:var(--line);color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--rivet);color:var(--rivet);background:var(--white);}

.filters{background:var(--white);border:1.5px solid var(--line);padding:14px 16px;margin-bottom:16px;display:none;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.filters.open{display:grid;}
.filter-f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mill);margin-bottom:4px;}
.filter-f .mm{display:flex;gap:6px;}
.filter-f input{width:100%;border:1px solid var(--line);padding:6px 8px;font-size:12px;font-family:'IBM Plex Mono';outline:none;}
.filter-f input:focus{border-color:var(--steel);}
.filter-clear{font-size:11px;color:var(--rivet);cursor:pointer;margin-top:4px;display:none;}
.filter-clear.show{display:inline-block;}

.tablewrap{border:1.5px solid var(--line);}
.tablewrap.scrollable{overflow-x:auto;}
table{border-collapse:collapse;width:100%;background:var(--white);}
th{position:sticky;top:73px;z-index:5;background:var(--steel);color:var(--white);text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:500;white-space:nowrap;}
/* Once .tablewrap is a scroll container (see checkTableOverflow), sticky's
   containing block becomes .tablewrap itself instead of the viewport, which
   just shoves th top:73px down INTO the table rather than failing safely.
   Cancel sticky entirely in that case so the header renders in normal flow. */
.tablewrap.scrollable th{position:static;top:auto;}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{background:var(--steel-dark);}
th.sortable.active{background:var(--steel-dark);}
td{padding:9px 12px;font-family:'IBM Plex Mono';font-size:12.5px;border-top:1px solid var(--line);white-space:nowrap;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--paper-2);}
td.nm{font-weight:500;color:var(--steel-dark);}
.empty{padding:40px 20px;text-align:center;color:var(--mill);font-size:13px;}

.sheet{background:var(--white);border:1.5px solid var(--line);padding:32px;margin-top:10px;position:relative;}
.sheet-head{display:flex;gap:28px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px;}
.sheet-ico{width:110px;height:110px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);}
.sheet-ico svg{width:70px;height:70px;stroke:var(--steel);}
.sheet-name{font-family:'Space Grotesk';font-weight:600;font-size:28px;}
.sheet-cat{font-size:12px;color:var(--mill);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.propgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--line);}
.prop{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;}
.prop:nth-child(odd){padding-right:20px;}
.prop:nth-child(even){padding-left:20px;border-left:1px solid var(--line);}
.prop .k{color:var(--ink-soft);}
.prop .v{font-family:'IBM Plex Mono';font-weight:500;}

footer.app-footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.5;color:var(--mill);}
.powered-by{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.powered-by span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mill);}
.powered-by img{height:28px;width:auto;display:block;}

@media(max-width:720px){
  .app{padding:0 14px 40px;}
  .top-row{gap:10px;padding:0 14px;}
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .cat-tile{padding:16px 8px 12px;}
  .cat-tile svg{width:44px;height:44px;}
  .propgrid{grid-template-columns:1fr;}
  .prop:nth-child(even){padding-left:4px;border-left:none;}
  .prop{padding:12px 4px;}
  th{position:static;}
  .search-input,.filter-f input{font-size:16px;}
  .btn,.pill{min-height:40px;display:inline-flex;align-items:center;}
  .btnrow{flex-wrap:wrap;}
  .sheet{padding:18px;}
  .sheet-head{gap:14px;flex-wrap:wrap;}
  .sheet-ico{width:64px;height:64px;}
  .sheet-ico svg{width:40px;height:40px;}
  .sheet-name{font-size:20px;}
  .page-title{font-size:21px;}
  .tablewrap.scrollable{-webkit-overflow-scrolling:touch;}
}
@media(max-width:480px){
  .brand-title-img{height:24px;}
  .brand-icon-img{width:32px;height:32px;}
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  .filters{grid-template-columns:1fr;}
}
</style>
</head>

/* Per-category "All" view: unified column set plus a map of per-sub row
   transforms for shapes whose native fields need aliasing or deriving to
   line up with that union (e.g. equal-leg angles have no separate "width"
   column since it's identical to depth). Fields with no equivalent in a
   given sub are simply left undefined and render as blank. */
const CATEGORY_ALL = {
  beams:      { cols:["area","depth","tw","bf","tf","Ix","Sx","Iy","Sy"], map:{} },
  channels:   { cols:["depth","bf","tw","area","weight","Ix","Iy","Sx","Sy"], map:{} },
  angles:     { cols:["depth","width","thickness","area","weight","Ix","Iy","Sx","Sy"],
    map:{ L: r=>({...r, width:r.depth, Iy:r.Ix}) } },
  sheetpiles: { cols:["width","height","tf","tw","area","pileWeight","wallWeight","elasticS","I"],
    labels: SHEETPILE_LABELS,
    map:{
      PZC:   r=>({...r, pileWeight:r.weight, wallWeight:Math.round((r.weight/(r.width/12))*100)/100}),
      SCZKZ: r=>({...r, tf:r.thickness, tw:r.thickness}),
      SKLKS: r=>({...r, tf:r.thickness, tw:r.thickness}),
    } },
  pipe:       { cols:["od","wall","weight","id","area","I","S","r"], map:{} },
  tee:        { cols:["depth","bf","tf","tw","area","Sx","Sy"], map:{} },
  hssr:       { cols:["depth","width","thickness","weight","area","Ix","Sx","Iy","Sy"],
    map:{ HSSQ: r=>{
      const m = r.name.match(/^HSS([\d.]+)X([\d.]+)X/);
      return {...r, depth:m?parseFloat(m[1]):undefined, width:m?parseFloat(m[2]):undefined, Ix:r.I, Sx:r.S, Iy:r.I, Sy:r.S};
    } } },
  hssc:       { cols:["od","weight","wall","area","I"], map:{} },
};

function buildAllRows(catKey){
  const cfg = CATEGORY_ALL[catKey];
  const c = CATEGORIES.find(x=>x.key===catKey);
  if(!cfg || !c) return [];
  let rows = [];
  c.subs.forEach(s=>{
    if(s.soon) return;
    const subData = DATA[s.key];
    if(!subData) return;
    const mapFn = cfg.map[s.key] || (r=>r);
    subData.rows.forEach(r=>{
      rows.push({...mapFn(r), _key:s.key, _type:subData.label});
    });
  });
  return rows;
}

function getSubData(){
  if(state.sub==="ALL"){
    const cfg = CATEGORY_ALL[state.cat.key];
    return { label:"All "+state.cat.nm, cols:["name",...cfg.cols], labels:cfg.labels, rows:buildAllRows(state.cat.key) };
  }
  return DATA[state.sub];
}

    </div>
  </footer>`;
}

function renderHome(){
  app.innerHTML = header() + `
    <div class="eyebrow">Steelmember</div>
    <h1 class="page-title">Browse by shape</h1>
    <div class="cat-grid">
      ${CATEGORIES.map(c=>`
        <div class="cat-tile" onclick="${c.soon?'':`openCategory('${c.key}')`}">
          ${c.soon?'<span class="soon-badge">Coming soon</span>':''}
          ${ICONS[c.icon]}
          <span class="nm">${c.nm}</span>
          <span class="sub">${c.sub}</span>
        </div>`).join("")}
    </div>
  ` + footer();
  wireHeader();
}

function openCategory(key){
  const c = CATEGORIES.find(x=>x.key===key);
  state.view="cat"; state.cat=c; state.sub="ALL"; state.filters={};
  state.sortCol=null; state.sortDir=null;
  render();
}

function renderCat(){
  const c = state.cat;
  const sub = state.sub ? getSubData() : null;
  app.innerHTML = header() + `
    <div class="eyebrow">${c.nm}</div>
    <h1 class="page-title">${sub?sub.label:c.nm}</h1>
    <div class="pillrow">
      <div class="pill ${state.sub==='ALL'?'active':''}" onclick="switchSub('ALL')">All</div>
      ${c.subs.map(s=>`<div class="pill ${s.soon?'pill-soon':''} ${s.key===state.sub?'active':''}" onclick="${s.soon?'':`switchSub('${s.key}')`}">${s.label}${s.soon?' — soon':''}</div>`).join("")}
    </div>
    ${sub ? filterPanel(sub) + tableFor(sub) : `<div class="empty">No data yet for this category.</div>`}
    <button class="backlink" onclick="goHome()">&larr; All categories</button>
  ` + footer();
  wireHeader();
  if(sub) wireFilterInputs();
}

function switchSub(s){ state.sub=s; state.filters={}; state.sortCol=null; state.sortDir=null; render(); }

function activeFilterCount(){
  return Object.values(state.filters).filter(f=>f&&(f.min!=null||f.max!=null)).length;
}

function updateFilterToggleLabel(){
  const btn = document.getElementById("filterToggle");
  if(!btn) return;
  const n = activeFilterCount();
  btn.textContent = (state.filtersOpen?"Hide filters":"Filters")+(n?` (${n})`:"");
}

function toggleFilters(){
  state.filtersOpen = !state.filtersOpen;
  document.querySelector(".filters").classList.toggle("open", state.filtersOpen);
  updateFilterToggleLabel();
}

function filterPanel(sub){
  const numCols = sub.cols.filter(c=>c!=="name");
  const n = activeFilterCount();
  return `<div class="toolbar">
    <span class="count" id="rowcount"></span>
    <div class="btnrow">
      <button class="btn ghost" id="filterToggle" onclick="toggleFilters()">${state.filtersOpen?"Hide filters":"Filters"}${n?` (${n})`:""}</button>
      <button class="btn ghost" onclick="clearAllFilters()">Clear all filters</button>
      <button class="btn" onclick="copyCurrentTable()">Copy table</button>
    </div>
  </div>
  <div class="filters${state.filtersOpen?" open":""}">
    ${numCols.map(c=>`
      <div class="filter-f" data-col="${c}">
        <label>${colLabel(sub,c,true)}</label>
        <div class="mm">
          <input type="number" step="any" placeholder="min" class="fmin" data-col="${c}">
          <input type="number" step="any" placeholder="max" class="fmax" data-col="${c}">
        </div>
        <span class="filter-clear" onclick="clearFilter('${c}')">Clear</span>
      </div>`).join("")}
  </div>`;
}

function wireFilterInputs(){
  document.querySelectorAll(".fmin,.fmax").forEach(inp=>{
    inp.oninput = ()=>{
      const col = inp.dataset.col;
      state.filters[col] = state.filters[col]||{};
      state.filters[col][inp.classList.contains("fmin")?"min":"max"] = inp.value===""?null:parseFloat(inp.value);
      refreshTable();
    };
  });
  refreshTable();
}

function applyFilters(rows, sub){
  return rows.filter(r=>{
    for(const col of sub.cols){
      if(col==="name") continue;
      const f = state.filters[col];
      if(!f) continue;
      const v = r[col];
      if(f.min!=null && v<f.min) return false;
      if(f.max!=null && v>f.max) return false;
    }
    return true;
  });
}

function tableHeadRow(sub){
  return sub.cols.map(c=>{
    const active = state.sortCol===c;
    const arrow = active ? (state.sortDir==="asc"?" ▲":" ▼") : "";
    return `<th class="sortable${active?" active":""}" onclick="sortByColumn('${c}')">${colLabel(sub,c,true)}${arrow}</th>`;
  }).join("");
}

function tableFor(sub){
  return `<div class="tablewrap"><table id="datatable">
    <thead><tr id="headrow">${tableHeadRow(sub)}</tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>`;
}

function sortByColumn(col){
  if(state.sortCol===col){
    state.sortDir = state.sortDir==="asc" ? "desc" : "asc";
  } else {
    state.sortCol = col;
    state.sortDir = "asc";
  }
  document.getElementById("headrow").innerHTML = tableHeadRow(getSubData());
  refreshTable();
}

function refreshTable(){
  const sub = getSubData();
  let filtered = applyFilters(sub.rows, sub);
  if(state.sortCol){
    const col = state.sortCol, dir = state.sortDir;
    filtered = filtered.slice().sort((a,b)=>{
      const av=a[col], bv=b[col];
      const aNull = av==null, bNull = bv==null;
      if(aNull && bNull) return 0;
      if(aNull) return 1;
      if(bNull) return -1;
      if(typeof av==="number" && typeof bv==="number") return dir==="asc" ? av-bv : bv-av;
      return dir==="asc" ? String(av).localeCompare(bv) : String(bv).localeCompare(av);
    });
  }
  document.getElementById("rowcount").textContent = filtered.length+" of "+sub.rows.length+" members";
  document.querySelectorAll(".filter-f").forEach(el=>{
    const col = el.dataset.col; const f = state.filters[col];
    el.querySelector(".filter-clear").classList.toggle("show", !!(f&&(f.min!=null||f.max!=null)));
  });
  updateFilterToggleLabel();
  const tbody = document.getElementById("tbody");
  if(filtered.length===0){
    tbody.innerHTML = `<tr><td colspan="${sub.cols.length}"><div class="empty">No members match these filters.</div></td></tr>`;
    checkTableOverflow();
    return;
  }
  tbody.innerHTML = filtered.map(r=>`
    <tr onclick="openMember('${r._key||state.sub}','${r.name}')">
      ${sub.cols.map(c=>{ const v=r[c]; return `<td class="${c==='name'?'nm':''}">${v==null||v===""?'—':v}</td>`; }).join("")}
    </tr>`).join("");
  checkTableOverflow();
}

/* Sticky th only works while .tablewrap has no scroll container of its own,
   so horizontal scroll is only enabled when the table genuinely doesn't fit
   (columns bleeding past the wrapper) rather than unconditionally. */
function checkTableOverflow(){
  const wrap = document.querySelector(".tablewrap");
  const table = document.getElementById("datatable");
  if(!wrap || !table) return;
  wrap.classList.toggle("scrollable", table.scrollWidth > wrap.clientWidth);
}

function clearFilter(col){
  delete state.filters[col];
  document.querySelectorAll(`.filter-f[data-col="${col}"] input`).forEach(i=>i.value="");
  refreshTable();
}
function clearAllFilters(){
  state.filters={};
  document.querySelectorAll(".fmin,.fmax").forEach(i=>i.value="");
  refreshTable();
}

function copyCurrentTable(){
  const sub = getSubData();
  const filtered = applyFilters(sub.rows, sub);
  let text = sub.cols.map(c=>colLabel(sub,c,false)).join("\t")+"\n";
  filtered.forEach(r=>{ text += sub.cols.map(c=>r[c]).join("\t")+"\n"; });
  navigator.clipboard.writeText(text);
  flashCopy(event.target);
}

function flashCopy(btn){
  const old = btn.textContent;
  btn.textContent = "Copied";
  setTimeout(()=>{btn.textContent=old;}, 1200);
}

function findCatForSub(subKey){
  return CATEGORIES.find(c=>c.subs.some(s=>s.key===subKey));
}

function openMember(subKey, name){
  const sub = DATA[subKey];
  const row = sub.rows.find(r=>r.name===name);
  state.view="member"; state.member={row, sub, subKey, cameFromSub: state.sub};
  render();
}

function renderMember(){
  const {row, sub, subKey} = state.member;
  const catObj = findCatForSub(subKey);
  app.innerHTML = header() + `
    <div class="eyebrow">${sub.label}</div>
    <div class="sheet tick">
      <div class="sheet-head">
        <div class="sheet-ico">${ICONS[catObj.icon]}</div>
        <div>
          <div class="sheet-name mono">${row.name}</div>
          <div class="sheet-cat">${sub.label} — ${sub.parent}</div>
        </div>
      </div>
      <div class="propgrid">
        ${sub.cols.filter(c=>c!=="name").map(c=>`
          <div class="prop"><span class="k">${colLabel(sub,c,true)}</span><span class="v">${row[c]}</span></div>`).join("")}
      </div>
      <div class="btnrow" style="margin-top:20px;">
        <button class="btn" onclick="copyMember()">Copy properties</button>
      </div>
    </div>
    <button class="backlink" onclick="backFromMember()">&larr; Back to ${sub.label}</button>
  ` + footer();
  wireHeader();
}

function copyMember(){
  const {row, sub} = state.member;
  let text = row.name+"\n";
  sub.cols.filter(c=>c!=="name").forEach(c=>{ text += colLabel(sub,c,false)+": "+row[c]+"\n"; });
  navigator.clipboard.writeText(text);
  flashCopy(event.target);
}

function backFromMember(){
  const subKey = state.member.subKey;
  const c = findCatForSub(subKey);
  state.view="cat"; state.cat=c; state.sub=state.member.cameFromSub||subKey;
  render();
}

function goHome(){ state.view="home"; state.search=""; render(); }

function wireHeader(){
  const box = document.getElementById("searchbox");
  const sugg = document.getElementById("suggest");
  box.oninput = ()=>{
    const q = box.value.trim().toUpperCase();
    state.search = box.value;
    if(q.length===0){ sugg.classList.remove("open"); return; }
    const matches = allRowsFlat().filter(r=>r.name.toUpperCase().includes(q)).slice(0,12);
    if(matches.length===0){ sugg.innerHTML = `<div class="suggest-item"><span class="ct">No matches</span></div>`; sugg.classList.add("open"); return; }
    sugg.innerHTML = matches.map(m=>`<div class="suggest-item" onclick="openMember('${m._key}','${m.name}')"><span class="nm">${m.name}</span><span class="ct">${m._cat}</span></div>`).join("");
    sugg.classList.add("open");
  };
  box.onkeydown = (e)=>{
    if(e.key==="Enter"){ sugg.classList.remove("open"); state.view="search"; render(); }
  };
  document.addEventListener("click",(e)=>{
    if(!e.target.closest(".search-wrap")) sugg.classList.remove("open");
  },{once:true});
}

function renderSearchResults(){
  const q = (state.search||"").trim().toUpperCase();
  const matches = q ? allRowsFlat().filter(r=>r.name.toUpperCase().includes(q)) : [];
  app.innerHTML = header() + `
    <div class="eyebrow">Search</div>
    <h1 class="page-title">Results for "${state.search}"</h1>
    <div class="count" style="margin-bottom:10px;">${matches.length} members found</div>
    <div class="tablewrap"><table>
      <thead><tr><th>Designation</th><th>Category</th></tr></thead>
      <tbody>
      ${matches.length===0 ? `<tr><td colspan="2"><div class="empty">No members match this search.</div></td></tr>` :
        matches.map(m=>`<tr onclick="openMember('${m._key}','${m.name}')"><td class="nm">${m.name}</td><td>${m._cat}</td></tr>`).join("")}
      </tbody>
    </table></div>
    <button class="backlink" onclick="goHome()">&larr; All categories</button>
  ` + footer();
  wireHeader();
}

render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
